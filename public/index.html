<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Neulemuistio</title>
  <meta name="description" content="Neuletöiden muistio: langat, ohjeet, kuvat, puikot ja muistiinpanot.">
  <meta name="theme-color" content="#8a4b5c">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Neulemuistio">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app"></main>

  <div id="lightbox" hidden data-action="close-lightbox"><img alt=""></div>
  <div id="toast" role="status" hidden></div>
  <div id="sheet" hidden>
    <div class="sheet-backdrop" data-action="close-sheet"></div>
    <div class="sheet-body" role="dialog" aria-modal="true"></div>
  </div>

  <input type="file" id="photoInput" accept="image/*" multiple hidden>
  <input type="file" id="patternInput" accept="image/*,application/pdf" multiple hidden>
  <input type="file" id="importInput" accept="application/json,.json,text/plain,.txt" hidden>

  <script type="module" src="app.js"></script>
</body>
</html>
